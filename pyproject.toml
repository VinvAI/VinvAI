# Root uv workspace for the Vinv open-source monorepo.
#
#   uv sync                      # install every member (editable) into ./.venv
#   uv run tracelens --help      # run any member's console script
#   uv run --package <name> pytest
#
# The extension spawns the engine CLIs as `<repo>/.venv/bin/<engine>` after
# `uv sync`, falling back to `uv run --project <repo> <engine>`.

# Dev tooling shared by every member's test suite; installed by `uv sync`
# (dev group is on by default), so `uv run pytest` works from any package dir.
# ruff belongs here too: every member declares it, but member dev-groups are
# NOT installed by a root `uv sync`, so `uv run ruff` — what the lint workflow
# and any developer runs from the repo root — had no binary to spawn. Pinned
# identically to the members so root and per-package linting agree.
[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "hypothesis>=6.100.0,<7.0.0",
    "ruff>=0.6.0,<0.9.0",
    # Exercises the exerciser's SQLAlchemy service-double cut point. The tests
    # skip without it, and a skipped honesty guarantee is no guarantee — this
    # keeps them RUNNING under the root `uv sync` that CI performs.
    "sqlalchemy>=2.0,<3.0",
]

# Python version policy (see issue #14). Ceiling is <3.15 for every member.
# Floors are tiered by role, and each member's ruff `target-version` matches its
# own floor: embedder >=3.10 (standalone embedding sidecar — widest reach),
# contracts and tracelens >=3.11 (the data contract and the tracer, which run
# against third-party targets), and every other engine >=3.12.
[tool.uv.workspace]
members = [
    "contracts",
    "core",
    "tracelens",
    "identification",
    "handbook",
    "bringup",
    "goal",
    "embedder",
    "exerciser",
]
