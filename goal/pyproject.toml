[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal"
version = "0.0.1"
description = "goal — standalone goal-authoring prompt renderer (distills a working context into one actionable goal via the caller's coding-agent harness)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.6.0,<0.9.0",
]

[project.scripts]
goal = "goal.cli:main"

[project.urls]
Homepage = "https://vinv.ai"
Repository = "https://github.com/VinvAI/VinvAI"
Issues = "https://github.com/VinvAI/VinvAI/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
