[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exerciser"
version = "0.0.1"
description = "Universal behavioral testing engine: exercise every discovered endpoint, profile outputs, learn invariants, close the coverage loop"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1.0,<9.0.0",
    "identification",
]

[project.optional-dependencies]
# The property-based generator arm. `generators.py` documents
# hypothesis-jsonschema as ADOPTED and `plan.py` consumes the
# `hypothesis_valid` candidates it produces — but until this extra existed the
# package was declared in no manifest at all, so `hypothesis_valid_available()`
# returned False in every install that has ever shipped and the arm was dead
# code. Optional by design (the in-tree generator in `schema.py` remains the
# guaranteed source for every input class), declared so it is installable and
# so CI can prove the arm actually runs.
propertygen = [
    "hypothesis>=6.100.0,<7.0.0",
    "hypothesis-jsonschema>=0.23.0,<0.24.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.6.0,<0.9.0",
    # Exercises the SQLAlchemy cut point of the service doubles (the tests
    # skip without it, and a skipped honesty guarantee is no guarantee).
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
# `vinv-exerciser` is the documented public console script; `exerciser` mirrors
# the engine-name→`.venv/bin/<name>` convention the extension uses to spawn
# engines (getBinPath(context, 'exerciser')).
vinv-exerciser = "exerciser.cli:main"
exerciser = "exerciser.cli:main"

[tool.uv.sources]
identification = { workspace = true }

[project.urls]
Homepage = "https://vinv.ai"
Repository = "https://github.com/VinvAI/VinvAI"
Issues = "https://github.com/VinvAI/VinvAI/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The differential oracle's ast-corpus is deliberately one Python snippet per
# line (newline-joined multi-statement programs); wrapping them would corrupt
# the source they represent.
"src/exerciser/differential.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
