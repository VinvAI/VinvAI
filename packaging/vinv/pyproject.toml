[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinv"
version = "0.0.3"
description = "Vinv runs, tests, and finds issues in your services — with zero code changes."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "VinvAI", email = "support@vinv.ai" }]
keywords = [
    "ai", "testing", "runtime-tracing", "observability", "mcp",
    "api-testing", "dead-code", "fault-injection", "python", "claude", "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Debuggers",
]

# The union of every engine's third-party dependencies. Internal engines
# (contracts, tracelens, identification) are bundled into this same wheel, so
# they are NOT listed here.
dependencies = [
    "PyYAML>=6.0.1,<7.0.0",
    "click>=8.1.0,<9.0.0",
    "einops>=0.7.0",
    "huggingface-hub>=0.23.0",
    "icontract>=2.6.0,<3.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "networkx>=3.2.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "opentelemetry-api>=1.27.0,<1.30.0",
    "opentelemetry-instrumentation>=0.48b0,<0.50.0",
    "opentelemetry-sdk>=1.27.0,<1.30.0",
    "pandas>=2.0.0,<2.3.0",
    "pyarrow>=23.0.1,<24.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "scipy>=1.11.0,<2.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
    "torch>=2.1.0",
]

[project.urls]
Homepage = "https://vinv.ai"
Repository = "https://github.com/VinvAI/VinvAI"
Issues = "https://github.com/VinvAI/VinvAI/issues"
Changelog = "https://github.com/VinvAI/VinvAI/blob/main/extension/CHANGELOG.md"

# Every engine's console script, on the one package. `index` is a shim that
# execs the bundled Rust binary (vinv/_index.py), so it is a first-class command
# under pip/pipx/uvx/uv-tool like the rest.
[project.scripts]
index = "vinv._index:main"
vinv-exerciser = "exerciser.cli:main"
exerciser = "exerciser.cli:main"
tracelens = "tracelens.cli:main"
identification = "identification.cli:main"
bringup = "bringup.cli:main"
goal = "goal.cli:main"
handbook = "handbook.cli:main"
vinv-embedder = "vinv_embedder.cli:main"

[tool.hatch.build.targets.wheel]
# The umbrella `vinv` module (version + future umbrella CLI) ships from here;
# the engine modules are pulled in from their in-repo homes below.
packages = ["vinv"]

# Assemble the single distribution: each engine's import package is force-
# included from its own `src/` tree into the wheel root. This is what makes
# `pip install vinv` provide `import tracelens`, `import exerciser`, … from one
# wheel. (Phase 1 step 4 will add the Rust `index` binary via cibuildwheel.)
[tool.hatch.build.targets.wheel.force-include]
"../../contracts/src/lens_contracts" = "lens_contracts"
"../../tracelens/src/tracelens" = "tracelens"
"../../identification/src/identification" = "identification"
"../../handbook/src/handbook" = "handbook"
"../../bringup/src/bringup" = "bringup"
"../../goal/src/goal" = "goal"
"../../embedder/src/vinv_embedder" = "vinv_embedder"
"../../exerciser/src/exerciser" = "exerciser"

# Compile + bundle the Rust `index` binary into the wheel (wheel target only,
# so the sdist stays pure). Makes the wheel platform-specific.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# ── cibuildwheel: one platform wheel per (python, OS) in CI ────────────────
# The build hook compiles + bundles the `index` binary itself, resolving its
# path from the repo root. cargo's target/ persists across the per-Python wheel
# builds on a platform, so Rust is compiled once and reused.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux* *_i686 *-win32 pp*"

[tool.cibuildwheel.linux]
# manylinux images have no Rust — install a minimal toolchain and put it on PATH
# so the build hook's `cargo build` (run inside the container) can find it.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
