[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinv"
version = "0.1.0"
description = "Vinv runs, tests, and finds issues in your services — with zero code changes."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "VinvAI", email = "support@vinv.ai" }]
keywords = [
    "ai", "testing", "runtime-tracing", "observability", "mcp",
    "api-testing", "dead-code", "fault-injection", "python", "claude", "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Debuggers",
]

# The union of every engine's third-party dependencies. Internal engines
# (contracts, tracelens, identification) are bundled into this same wheel, so
# they are NOT listed here.
dependencies = [
    "PyYAML>=6.0.1,<7.0.0",
    "click>=8.1.0,<9.0.0",
    "einops>=0.7.0",
    "huggingface-hub>=0.23.0",
    "icontract>=2.6.0,<3.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "networkx>=3.2.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "opentelemetry-api>=1.27.0,<1.30.0",
    "opentelemetry-instrumentation>=0.48b0,<0.50.0",
    "opentelemetry-sdk>=1.27.0,<1.30.0",
    "pandas>=2.0.0,<2.3.0",
    "pyarrow>=23.0.1,<24.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "scipy>=1.11.0,<2.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
    "torch>=2.1.0",
]

[project.urls]
Homepage = "https://vinv.ai"
Repository = "https://github.com/VinvAI/VinvAI"
Issues = "https://github.com/VinvAI/VinvAI/issues"
Changelog = "https://github.com/VinvAI/VinvAI/blob/main/extension/CHANGELOG.md"

# Every engine's console script, on the one package.
[project.scripts]
vinv-exerciser = "exerciser.cli:main"
exerciser = "exerciser.cli:main"
tracelens = "tracelens.cli:main"
identification = "identification.cli:main"
bringup = "bringup.cli:main"
goal = "goal.cli:main"
handbook = "handbook.cli:main"
vinv-embedder = "vinv_embedder.cli:main"

[tool.hatch.build.targets.wheel]
# The umbrella `vinv` module (version + future umbrella CLI) ships from here;
# the engine modules are pulled in from their in-repo homes below.
packages = ["vinv"]

# Assemble the single distribution: each engine's import package is force-
# included from its own `src/` tree into the wheel root. This is what makes
# `pip install vinv` provide `import tracelens`, `import exerciser`, … from one
# wheel. (Phase 1 step 4 will add the Rust `index` binary via cibuildwheel.)
[tool.hatch.build.targets.wheel.force-include]
"../../contracts/src/lens_contracts" = "lens_contracts"
"../../tracelens/src/tracelens" = "tracelens"
"../../identification/src/identification" = "identification"
"../../handbook/src/handbook" = "handbook"
"../../bringup/src/bringup" = "bringup"
"../../goal/src/goal" = "goal"
"../../embedder/src/vinv_embedder" = "vinv_embedder"
"../../exerciser/src/exerciser" = "exerciser"
