[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.1.0"
description = "Third-party log-based tracing and RCA CLI (OTel launcher + offline analysis)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
    "opentelemetry-api>=1.27.0,<1.30.0",
    "opentelemetry-sdk>=1.27.0,<1.30.0",
    "opentelemetry-instrumentation>=0.48b0,<0.50.0",
    "icontract>=2.6.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "pandas>=2.0.0,<2.3.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "networkx>=3.2.0,<4.0.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "pyarrow>=23.0.1,<24.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "lens-contracts",
]

[project.optional-dependencies]
otel-libs = [
    "opentelemetry-instrumentation-fastapi>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-requests>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-httpx>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-redis>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-psycopg2>=0.48b0,<0.50.0",
    "opentelemetry-instrumentation-asyncio>=0.48b0,<0.50.0",
]
rca = [
    "dowhy>=0.11.0,<0.13.0",
    "pyrca>=0.1.0,<0.3.0",
]
drift = [
    "evidently>=0.4.0,<0.5.0",
]
demo = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "httpx>=0.27.0,<0.29.0",
]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "hypothesis>=6.100.0,<7.0.0",
    "ruff>=0.6.0,<0.9.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
tracelens = "tracelens.cli:main"

[project.entry-points."opentelemetry_configurator"]
tracelens = "tracelens.otel.configurator:TracelensConfigurator"

[tool.uv.sources]
lens-contracts = { workspace = true }

[project.urls]
Homepage = "https://vinv.ai"
Repository = "https://github.com/VinvAI/VinvAI"
Issues = "https://github.com/VinvAI/VinvAI/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["tracelens"]

[[tool.mypy.overrides]]
module = ["pandas.*", "networkx.*", "jsonschema.*", "dowhy.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
